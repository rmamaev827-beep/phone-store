# Render Blueprint: backend (Express API) + PostgreSQL.
# Render -> New -> Blueprint -> выбрать этот репозиторий.
services:
  - type: web
    name: phone-store-api
    runtime: node
    rootDir: server
    plan: free
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: phone-store-db
          property: connectionString
      - key: ADMIN_LOGIN
        value: admin
      # пароль админки вводится в панели Render при создании — в репозиторий он не попадает
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: phone-store-db
    plan: free
    region: frankfurt
    databaseName: phone_store
